[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Libraries without stubs - allow untyped imports
[[tool.mypy.overrides]]
module = [
    "easyocr",
    "argostranslate.*",
    "langdetect",
    "deep_translator",
    "cv2",
    # Fusión multi-OCR (Ago 2026): módulos instalados sin stubs/py.typed
    "ctranslate2",
    "ctranslate2.*",
    "transformers",
    "onnxruntime",
    "rapidocr_onnxruntime",
    "fitz",
]
ignore_missing_imports = true

# flask_limiter - no trae stubs (sin py.typed); se instala en el CI de
# GitHub (lint-test/server-test) porque ratelimit.py y routes/api.py lo
# importan a nivel de módulo, pero mypy no puede resolver sus tipos.
[[tool.mypy.overrides]]
module = [
    "flask_limiter.*",
]
ignore_missing_imports = true

# waitress - sin stubs (import-untyped); servidor de producción (Fase 2.1).
# Instalado en requirements.txt y en los jobs de CI que arrancan server.py.
# Solo el módulo raíz se importa (`from waitress import serve` en server.py
# y main.py); "waitress.*" quedó sin uso y mypy lo marcaba como unused.
[[tool.mypy.overrides]]
module = [
    "waitress",
]
ignore_missing_imports = true

# PyTorch - NO instalado en el CI de GitHub (lint-test no instala torch);
# la sección es necesaria aunque torch tenga py.typed en el venv local.
[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true

# Allow monkey-patching on session.request (translator.py:123)
[[tool.mypy.overrides]]
module = "translator"
disable_error_code = ["method-assign"]
