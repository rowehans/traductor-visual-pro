name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'AGENTS.md'
      - 'CODEGRAPH.md'
      # El bot actualiza coverage_base.json tras cada push a main; ignorarlo
      # evita que ese commit re-dispare el workflow (loop). Es un snapshot de
      # datos, no código.
      - 'coverage_base.json'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'

env:
  PYTHONIOENCODING: utf-8

jobs:
  # ─── Job 1: Syntax + mypy + 247 tests (rápido, ~1 min) ────────
  # Se ejecuta en CADA push a main/master y en cada PR.
  lint-test:
    name: Lint + mypy + tests
    runs-on: ubuntu-latest
    # contents: read para el checkout; pull-requests: write para que el bot
    # pueda publicar/actualizar el comentario de cobertura en el PR.
    permissions:
      # contents: write — el paso de refresh del baseline de cobertura
      # commitea coverage_base.json en main con el bot.
      contents: write
      pull-requests: write
    steps:
      # fetch-depth: 0 — el gate de cobertura calcula el diff de la rama vs su
      # base (GITHUB_BASE_REF), así que la historia completa debe estar.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies (OpenCV)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 \
            2>/dev/null || true

      - name: Install Python dependencies
        run: |
          pip install --quiet \
            pytest pytest-mock pytest-cov \
            flask opencv-python-headless numpy pillow \
            langdetect deep-translator \
            flask-sqlalchemy \
            flask-limiter \
            requests \
            waitress \
            pyspellchecker \
            psutil \
            pymupdf \
            bandit \
            mypy==2.3.0 types-requests types-psutil lxml

      - name: Run CI (syntax + mypy + tests, sin servidor)
        run: |
          python run_ci.py --skip-server
        env:
          CI: "true"

      # Refresca coverage_base.json (el snapshot contra el que el reporte
      # muestra el Δ por módulo) en cada push a main. Idempotente: si la
      # medición no cambió, no hay commit; si cambió, el bot lo commitea y el
      # push resultante cae en paths-ignore (no re-dispara el workflow). En
      # PRs no corre — el reporte usa el snapshot ya commiteado de main.
      - name: Refresh coverage baseline (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          python -c "import run_ci; run_ci._write_base_coverage(run_ci.COVERAGE_JSON)"
          if git diff --quiet coverage_base.json; then
            echo "Baseline de cobertura sin cambios"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add coverage_base.json
            git commit -m "chore: actualizar baseline de cobertura por módulo"
            git push
          fi

      # Reporte de anotaciones de tipos: HTML por módulo (cobertura de
      # anotaciones, precisión de tipos). Se genera aunque mypy falle, para
      # inspeccionar el estado del tipado en el PR. La lista de archivos se
      # obtiene de run_ci._PROD_PY_FILES (fuente única de verdad).
      - name: Generate mypy annotation report
        if: always()
        run: |
          FILES=$(python -c "import run_ci; print(' '.join(run_ci._PROD_PY_FILES))")
          python -m mypy --html-report mypy-report $FILES

      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report
          path: mypy-report/
          retention-days: 14

      # Reporte HTML de cobertura por módulo (lo genera el paso pytest de
      # run_ci.py en coverage_html/index.html — autocontenido). Se sube aunque
      # el job falle, para poder inspeccionar la cobertura del PR en el
      # artifact.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_html/index.html
          if-no-files-found: warn
          retention-days: 14

      # Resumen de cobertura por módulo en el step summary del run: tabla con
      # %/umbral/estado y los módulos que bajaron de umbral, para revisarlos
      # sin abrir el artifact. Lo genera run_ci.write_coverage_summary desde
      # el mismo JSON del gate. `if: always()` para que el resumen aparezca
      # aunque el job falle.
      - name: Publish coverage summary
        if: always()
        run: |
          python -c "import run_ci; run_ci.write_coverage_summary()"

      # Comentario del bot en el PR con la cobertura por módulo (% y umbral), vía
      # GITHUB_TOKEN (permiso pull-requests: write de este job). run_ci busca el
      # comentario previo marcado y lo actualiza, para no spamear uno por commit.
      # Solo en PRs; si falla la API (fork sin permisos) avisa sin romper el job.
      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request'
        run: |
          python -c "import run_ci; run_ci.write_coverage_comment()"

  # ─── Job 2: Server + endpoints (deps completas, ~2 min) ──────
  server-test:
    name: Server + API
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.ref_type == 'branch'  # Solo en branches, no en tags
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 \
            2>/dev/null || true

      - name: Install Python dependencies
        run: |
          pip install --quiet \
            pytest pytest-mock pytest-cov \
            flask opencv-python-headless numpy pillow \
            langdetect deep-translator \
            flask-sqlalchemy \
            flask-limiter \
            requests \
            waitress \
            pyspellchecker \
            psutil \
            pymupdf \
            bandit

      # mypy ya se corrió en lint-test (job anterior). Omitirlo aquí evita
      # duplicar el trabajo; este job verifica servidor + endpoints reales.
      # La cobertura corre con coverage (pytest + arranque real del servidor
      # bajo `coverage run --append`), y el gate por módulo se re-verifica
      # con el servidor incluido al final del paso pytest.
      - name: Run CI with server test
        run: |
          python run_ci.py --skip-mypy
        env:
          CI: "true"

      # Reporte HTML de cobertura por módulo CON el arranque real del
      # servidor incluido (step_server lo regenera en coverage_html/ tras
      # detener el servidor). Nombre distinto al de lint-test para no
      # colisionar en el mismo run.
      - name: Upload coverage report (with server)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-server
          path: coverage_html/index.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload server log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-server-log
          path: ci_server.log
          retention-days: 7

  # ─── Job 3: Build frontend (solo main) ───────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.ref_type == 'branch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend
        run: |
          pip install --quiet rcssmin rjsmin
          if [ -f build.py ]; then
            python build.py && \
            if [ -d dist/ ] && [ "$(ls -A dist/ 2>/dev/null)" ]; then
              echo "Build complete - dist/ created"
              echo "build_done=true" >> $GITHUB_ENV
            else
              echo "[WARN] build.py ran but dist/ is empty or missing"
            fi
          else
            echo "No build.py found, skipping build"
          fi

      - name: Upload build artifact
        if: env.build_done == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  # ─── Job 4: Release validation (solo tags) ───────────────────
  release-validate:
    name: Validate release
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: |
          errors=0
          for f in server.py routes/api.py routes/main.py config.py translator.py ocr_utils.py cache.py ratelimit.py; do
            if [ -f "$f" ]; then
              python -m py_compile "$f" || { echo "❌ SYNTAX ERROR: $f"; errors=1; }
            fi
          done
          exit $errors

      - name: Validate README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "❌ README.md missing"
            exit 1
          fi
          echo "✅ Repository validated for release"

      - name: Generate release notes
        run: |
          echo "# Traductor Visual Pro ${{ github.ref_name }}" > release_notes.md
          echo "" >> release_notes.md
          echo "## Commits recientes" >> release_notes.md
          echo "" >> release_notes.md
          echo '```' >> release_notes.md
          git log --oneline --no-decorate -20 >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "**Nota**: El .exe se compila localmente con GPU/CUDA." >> release_notes.md
          echo "Usa \`create_release.ps1\` para generar el release local." >> release_notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
          retention-days: 1

      - name: Notify
        run: |
          echo "## ✅ Release ${{ github.ref_name }} validado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ejecuta localmente para crear el release con GPU:" >> $GITHUB_STEP_SUMMARY
          echo '```powershell' >> $GITHUB_STEP_SUMMARY
          echo '.\create_release.ps1 -TagVersion ${{ github.ref_name }} -Push' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ─── Job 5: Summary ──────────────────────────────────────────
  summary:
    name: Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [lint-test, server-test, build, release-validate]
    steps:
      - run: |
          echo "## CI/CD Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Trigger |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint + mypy + Test | ${{ needs.lint-test.result }} | Push/PR a main |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "| Release validate | ${{ needs.release-validate.result }} | Tag push |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Server + API | ${{ needs.server-test.result }} | Push/PR a main |" >> $GITHUB_STEP_SUMMARY
            echo "| Build | ${{ needs.build.result }} | Push a main |" >> $GITHUB_STEP_SUMMARY
          fi
