name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check syntax
        run: |
          python -m py_compile server.py
          python -m py_compile manga_pipeline.py
          python -m py_compile build.py
          python -m py_compile models.py

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install rjsmin rcssmin
      - name: Build
        run: |
          python build.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-translate:
    runs-on: ubuntu-latest
    env:
      # Desactivar MIT en CI para evitar descarga de modelos
      SKIP_MIT_INIT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 2>/dev/null || true
      - name: Install Python deps
        run: |
          pip install --quiet rjsmin rcssmin langdetect deep-translator
      - name: Test language detection (standalone)
        run: |
          python test_ci.py