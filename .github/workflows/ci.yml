name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'AGENTS.md'
      - 'CODEGRAPH.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'

env:
  PYTHONIOENCODING: utf-8

jobs:
  # ─── Job 1: Syntax + 247 tests (rápido, ~30s) ────────────────
  # Se ejecuta en CADA push a main/master y en cada PR.
  lint-test:
    name: Lint + 247 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies (OpenCV)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 \
            2>/dev/null || true

      - name: Install Python dependencies
        run: |
          pip install --quiet \
            pytest pytest-mock \
            flask opencv-python-headless numpy pillow \
            langdetect deep-translator \
            flask-sqlalchemy \
            requests

      - name: Run CI (syntax + 247 tests, sin servidor)
        run: |
          python run_ci.py --skip-server
        env:
          CI: "true"

  # ─── Job 2: Server + endpoints (deps completas, ~2 min) ──────
  server-test:
    name: Server + API
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.ref_type == 'branch'  # Solo en branches, no en tags
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 \
            2>/dev/null || true

      - name: Install Python dependencies
        run: |
          pip install --quiet \
            pytest pytest-mock \
            flask opencv-python-headless numpy pillow \
            langdetect deep-translator \
            flask-sqlalchemy \
            requests

      - name: Run CI with server test
        run: |
          python run_ci.py
        env:
          CI: "true"

      - name: Upload server log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-server-log
          path: ci_server.log
          retention-days: 7

  # ─── Job 3: Build frontend (solo main) ───────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.ref_type == 'branch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend
        run: |
          pip install --quiet rcssmin rjsmin
          if [ -f build.py ]; then
            python build.py && \
            if [ -d dist/ ] && [ "$(ls -A dist/ 2>/dev/null)" ]; then
              echo "Build complete - dist/ created"
              echo "build_done=true" >> $GITHUB_ENV
            else
              echo "[WARN] build.py ran but dist/ is empty or missing"
            fi
          else
            echo "No build.py found, skipping build"
          fi

      - name: Upload build artifact
        if: env.build_done == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  # ─── Job 4: Release validation (solo tags) ───────────────────
  release-validate:
    name: Validate release
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: |
          errors=0
          for f in server.py routes/api.py routes/main.py config.py translator.py ocr_utils.py cache.py ratelimit.py; do
            if [ -f "$f" ]; then
              python -m py_compile "$f" || { echo "❌ SYNTAX ERROR: $f"; errors=1; }
            fi
          done
          exit $errors

      - name: Validate README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "❌ README.md missing"
            exit 1
          fi
          echo "✅ Repository validated for release"

      - name: Generate release notes
        run: |
          echo "# Traductor Visual Pro ${{ github.ref_name }}" > release_notes.md
          echo "" >> release_notes.md
          echo "## Commits recientes" >> release_notes.md
          echo "" >> release_notes.md
          echo '```' >> release_notes.md
          git log --oneline --no-decorate -20 >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "**Nota**: El .exe se compila localmente con GPU/CUDA." >> release_notes.md
          echo "Usa \`create_release.ps1\` para generar el release local." >> release_notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
          retention-days: 1

      - name: Notify
        run: |
          echo "## ✅ Release ${{ github.ref_name }} validado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ejecuta localmente para crear el release con GPU:" >> $GITHUB_STEP_SUMMARY
          echo '```powershell' >> $GITHUB_STEP_SUMMARY
          echo '.\create_release.ps1 -TagVersion ${{ github.ref_name }} -Push' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ─── Job 5: Summary ──────────────────────────────────────────
  summary:
    name: Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [lint-test, server-test, build, release-validate]
    steps:
      - run: |
          echo "## CI/CD Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Trigger |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint + Test | ${{ needs.lint-test.result }} | Push/PR a main |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "| Release validate | ${{ needs.release-validate.result }} | Tag push |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Server + API | ${{ needs.server-test.result }} | Push/PR a main |" >> $GITHUB_STEP_SUMMARY
            echo "| Build | ${{ needs.build.result }} | Push a main |" >> $GITHUB_STEP_SUMMARY
          fi
