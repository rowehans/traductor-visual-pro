name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check syntax
        run: |
          python -m py_compile server.py
          python -m py_compile manga_pipeline.py
          python -m py_compile build.py
          python -m py_compile models.py

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install rjsmin rcssmin
      - name: Build
        run: |
          python build.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-translate:
    runs-on: ubuntu-latest
    env:
      # Desactivar MIT en CI para evitar descarga de modelos
      SKIP_MIT_INIT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install langdetect deep-translator
      - name: Test language detection (standalone)
        run: |
          python -c "
import sys, re
sys.path.insert(0, '.')

# Test standalone sin importar server.py (evita inicializar MIT)
def _detect_language_simple(text: str) -> str:
    text = text.strip()
    if not text:
        return 'en'
    # CJK
    if any(0xac00 <= ord(c) <= 0xd7a3 for c in text):
        return 'ko'
    if any((0x3040 <= ord(c) <= 0x30ff) or (0x4e00 <= ord(c) <= 0x9faf) for c in text):
        return 'ja'
    # Heurística español
    if any(c in 'áéíóúñüÁÉÍÓÚÑÜ¿¡' for c in text):
        return 'es'
    text_lower = text.lower()
    spa_words = {'el','la','los','las','que','en','un','una','de','con','es','para','por','si','no',
        'y','pero','como','cómo','mas','más','bien','todo','todos','esta','este','tus','sus','mi',
        'me','se','lo','le','te','al','del','tú','yo','criar','villano','villanos','correcto',
        'correctamente','ayudan','administrar','subimos','oficial','visitas','hacer','hola',
        'gracias','capitulo','capítulo','temporada','responderme','responder'}
    words = {w.strip('.,¡!¿?()[]{}*\"\'') for w in text_lower.split()}
    if spa_words.intersection(words):
        return 'es'
    # Sufijos verbales españoles
    for w in words:
        if len(w) > 2 and any(w.endswith(suf) for suf in ('arme','erme','irme','arte','erte','irte',
            'arse','erse','irse','arle','erle','irle','arnos','ernos','irnos','arlos','erlos','irlos')):
            return 'es'
    return 'en'

assert _detect_language_simple('RESPONDERME?') == 'es', 'Fallo es: RESPONDERME?'
assert _detect_language_simple('Hello world') == 'en', 'Fallo en: Hello world'
assert _detect_language_simple('¿Puedes ayudarme?') == 'es', 'Fallo es: ¿Puedes ayudarme?'
assert _detect_language_simple('Gracias por todo') == 'es', 'Fallo es: Gracias por todo'
print('Test OK')
"