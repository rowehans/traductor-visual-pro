name: Release (local build)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  # Validación: verifica que el repositorio está sano antes del release
  validate:
    name: Validate repo before release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: |
          errors=0
          for f in server.py routes/api.py routes/main.py config.py translator.py ocr_utils.py cache.py ratelimit.py; do
            if [ -f "$f" ]; then
              python -m py_compile "$f" || { echo "❌ SYNTAX ERROR: $f"; errors=1; }
            fi
          done
          exit $errors

      - name: Validate CHANGELOG exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "❌ README.md missing"
            exit 1
          fi
          echo "✅ Repository validated for release"

      - name: Generate release notes
        run: |
          echo "# Traductor Visual Pro ${{ github.ref_name }}" > release_notes.md
          echo "" >> release_notes.md
          echo "## Commits recientes" >> release_notes.md
          echo "" >> release_notes.md
          echo '```' >> release_notes.md
          git log --oneline --no-decorate -20 >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "**Nota**: El .exe se compila localmente con GPU/CUDA." >> release_notes.md
          echo "Usa \`create_release.ps1\` para generar el release local." >> release_notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
          retention-days: 1

      - name: Notify
        run: |
          echo "✅ Release validado. Ejecuta localmente:" >> $GITHUB_STEP_SUMMARY
          echo '```powershell' >> $GITHUB_STEP_SUMMARY
          echo '.\create_release.ps1 -TagVersion ${{ github.ref_name }} -NoBuild -Push' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
